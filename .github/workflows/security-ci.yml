name: Security CI (Lint + Test + SAST + SCA + DAST)

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  DAST_TARGET_URL: ${{ secrets.DAST_TARGET_URL }}

jobs:
  install:
    name: Install deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

  lint_test:
    name: Lint & Unit tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present -- --ci

  sast_semgrep:
    name: SAST (Semgrep) -> Code Scanning
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install "semgrep==1.69.0"
      - name: Run Semgrep (TS/JS/React)
        run: |
          # Regras públicas + suas regras locais (.semgrep/rules.yml)
          semgrep --config "p/javascript" --config "p/typescript" --config . --error --sarif -o semgrep.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  sca:
    name: SCA (Snyk ou npm audit)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Snyk monitor
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@v0.4.0
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          command: monitor

      - name: Snyk test (break on high)
        if: ${{ env.SNYK_TOKEN != '' }}
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        run: npx snyk test --severity-threshold=high

      - name: npm audit (fallback)
        if: ${{ env.SNYK_TOKEN == '' }}
        run: npm audit --audit-level=high

  dast_zap:
    name: DAST (OWASP ZAP) — opcional
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan
        if: ${{ env.DAST_TARGET_URL != '' }}
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: ${{ env.DAST_TARGET_URL }}
          cmd_options: "-a -m 3"
