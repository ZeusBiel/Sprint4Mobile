name: Security CI (Lint + Test + SAST + SCA + DAST)

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:


permissions:
  contents: read
  security-events: write

jobs:
  install:
    name: Install deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

  lint_test:
    name: Lint & Unit tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present -- --ci

  sast_semgrep:
    name: SAST (Semgrep) -> Code Scanning
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install "semgrep==1.69.0"
      - name: Run Semgrep (TS/JS/React)
        run: |
          # Regras públicas + suas regras locais (.semgrep/rules.yml)
          semgrep --config "p/javascript" --config "p/typescript" --config . --error --sarif -o semgrep.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  sca:
    name: SCA (Snyk ou npm audit)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Snyk monitor (conditional)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN set -> running snyk monitor"
            npx snyk monitor
          else
            echo "SNYK_TOKEN not set -> skipping snyk monitor"
          fi

      - name: Snyk test (conditional, break on high)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN set -> running snyk test"
            npx snyk test --severity-threshold=high
          else
            echo "SNYK_TOKEN not set -> skipping snyk test"
          fi

      - name: npm audit (fallback when Snyk missing)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "Running npm audit fallback"
            npm audit --audit-level=high
          else
            echo "SNYK_TOKEN set -> skipping npm audit fallback"
          fi

    dast_zap:
    name: DAST (OWASP ZAP) — opcional
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline (conditional)
        env:
          DAST_TARGET_URL: ${{ secrets.DAST_TARGET_URL }}
        run: |
          if [ -z "$DAST_TARGET_URL" ]; then
            echo "DAST_TARGET_URL not set -> skipping ZAP"
            exit 0
          fi
          if ! echo "$DAST_TARGET_URL" | grep -E '^https?://'; then
            echo "DAST_TARGET_URL must start with http:// or https://"
            exit 1
          fi

          docker run --rm \
            -v "$(pwd):/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$DAST_TARGET_URL" -j -w report_md.md -r report_html.html -a -m 3

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_md.md
            report_html.html

